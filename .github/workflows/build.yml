name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an older, still running build pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Building the ISO takes minutes: only do it when something that ends up in the image changed.
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.f.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: f
        run: |
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" != push ] || [[ "$GITHUB_REF" == refs/tags/* ]] \
             || [ -z "$before" ] || [ "$before" = 0000000000000000000000000000000000000000 ] \
             || ! git cat-file -e "$before" 2>/dev/null; then
            echo "image=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$before" "${{ github.sha }}" \
               | grep -qE '^(config/|auto/|suite/|scripts/|build\.sh|VERSION|\.github/workflows/)'; then
            echo "image=true" >> "$GITHUB_OUTPUT"
          else
            echo "image=false" >> "$GITHUB_OUTPUT"
            echo "Only docs or tests changed: skipping the ISO build."
          fi

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y shellcheck desktop-file-utils
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check-packages.py
      - run: shellcheck -S warning build.sh auto/config auto/build auto/clean config/hooks/live/*.chroot config/includes.chroot_after_packages/usr/local/bin/quack

  iso:
    # Runs in parallel with `static`. Release (tag) builds use xz for the smallest ISO; test builds use gzip,
    # which is about 4 minutes faster.
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RELEASE_BUILD: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (the build needs about 15 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Build the ISO inside Debian 13
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          compression=gzip
          [ "$RELEASE_BUILD" = true ] && compression=xz
          echo "squashfs compression: $compression"
          docker run --rm --privileged -e GITHUB_TOKEN -e QUACKOS_COMPRESSION="$compression" \
            -v "$PWD":/work -w /work debian:trixie bash -c '
            set -euo pipefail
            apt-get update
            apt-get install -y --no-install-recommends live-build debootstrap squashfs-tools xorriso \
                ca-certificates curl jq git sudo python3
            ./build.sh
          '
          sudo chown -R "$USER": out
          ls -lh out
      - name: Check what is inside the image (no boot needed)
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools xorriso
          sudo python3 scripts/image-check.py out/quackos-*-amd64.iso
      - uses: actions/upload-artifact@v4
        # The 2 GB image is only uploaded when someone needs it: a release (tag) or a manual run.
        if: always() && hashFiles('out/*.iso') != '' && (env.RELEASE_BUILD == 'true' || github.event_name == 'workflow_dispatch')
        with:
          name: QuackOS-ISO
          retention-days: 7
          compression-level: 0
          path: out/*

  release:
    # Pushing a tag like v0.1.0 publishes that version's ISO.
    needs: [static, iso]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches VERSION
        run: |
          if [ "v$(cat VERSION)" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION ($(cat VERSION))"; exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: QuackOS-ISO
          path: out
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          iso="$(ls quackos-*-amd64.iso)"
          size=$(stat -c %s "$iso")
          files=("$iso" "$iso.sha256")
          # GitHub release assets are limited to 2 GiB: split bigger images, they join back with cat.
          if [ "$size" -gt 2140000000 ]; then
            split -d -b 1900M "$iso" "$iso.part"
            rm "$iso"
            files=("$iso".part* "$iso.sha256")
            note="The image is split in parts (GitHub's 2 GiB limit). Join them with: \`cat $iso.part* > $iso\` then check with \`sha256sum -c $iso.sha256\`."
          else
            note="Write it to a USB stick with Balena Etcher, KDE ISO Image Writer, or \`dd\`."
          fi
          cd ..
          {
            echo "QuackOS $(cat VERSION): Debian 13 + KDE Plasma, with the whole Quezka suite preinstalled."
            echo
            echo "$note"
            echo
            echo "Live user: \`quack\`, password: \`live\`. Click *Install QuackOS* on the desktop to install."
          } > notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "QuackOS $(cat VERSION)" \
            --notes-file notes.md $(printf 'out/%s ' "${files[@]}")
