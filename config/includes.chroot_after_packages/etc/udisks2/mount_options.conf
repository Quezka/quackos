# QuackOS: how udisks2 (KDE Device Notifier, Dolphin) mounts NTFS volumes.
#
# Only the ntfs-3g driver is allowed. It refuses to mount a volume that Windows left
# hibernated (Fast Startup) or in an unclean state, instead of writing to it and
# corrupting it. Do not add ntfs3 here: udisks would fall back to it after ntfs-3g
# refuses, and that fallback is exactly the unsafe path.
[defaults]
ntfs_drivers=ntfs
ntfs_defaults=uid=$UID,gid=$GID,windows_names
ntfs_allow=uid=$UID,gid=$GID,umask,dmask,fmask,locale,windows_names,compression,nocompression,big_writes
